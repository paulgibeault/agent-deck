<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sessions rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Sessions" style="width: 288px; height: 960px; box-sizing: border-box; display: flex; flex-direction: column; background: #131519; border-right: 1px solid #23262C; font-family: Geist, system-ui, sans-serif; color: #E8E9EB; font-size: 13px">

  <div style="display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px">
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="18" height="18" rx="5" fill="#1F2A24" stroke="#4CC38A"/><path d="M6 7h8M6 10h5M6 13h7" stroke="#4CC38A" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span style="font-weight: 600; letter-spacing: 0.01em">agent-deck</span>
    <span style="flex-grow: 1"></span>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8FD9B0"><span style="width: 6px; height: 6px; border-radius: 3px; background: #4CC38A"></span>Live</span>
  </div>

  <div style="padding: 0 12px 10px">
    <label style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: 8px; background: #0C0D0F; border: 1px solid #2E333A; color: #8B919B">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14" stroke-linecap="round"/></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Filter sessions</span>
      <input type="search" placeholder="Filter sessions" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #E8E9EB; font: inherit; font-size: 12.5px">
      <kbd style="font-family: 'Geist Mono', monospace; font-size: 10.5px; color: #8B919B; border: 1px solid #2E333A; border-radius: 4px; padding: 0 5px">/</kbd>
    </label>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 0 12px 12px">
    <button type="button" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 7px 9px; border-radius: 8px; border: 1px solid #23262C; background: #171A1E; color: inherit; font: inherit; cursor: pointer">
      <span style="font-size: 16px; font-weight: 600; color: #8FD9B0">3</span><span style="font-size: 11px; color: #8B919B">working</span>
    </button>
    <button type="button" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 7px 9px; border-radius: 8px; border: 1px solid #4A3B1E; background: #1F1A12; color: inherit; font: inherit; cursor: pointer">
      <span style="font-size: 16px; font-weight: 600; color: #F0BC62">1</span><span style="font-size: 11px; color: #C9A86A">your turn</span>
    </button>
    <button type="button" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 7px 9px; border-radius: 8px; border: 1px solid #23262C; background: #171A1E; color: inherit; font: inherit; cursor: pointer">
      <span style="font-size: 16px; font-weight: 600; color: #F29B9B">8</span><span style="font-size: 11px; color: #8B919B">errors</span>
    </button>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 0 6px">
    <div style="display: flex; align-items: center; gap: 6px; padding: 8px 8px 4px; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #8B919B">Active <span style="font-weight: 400">3</span><button type="button" aria-label="Ask about active sessions" title="Ask about active sessions" style="margin-left: auto; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 5px; border: 1px solid #3B3456; background: #1B1828; color: #C9B8F8; cursor: pointer"><svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1.5l1.5 4.6 4.6 1.5-4.6 1.5L8 13.7l-1.5-4.6L1.9 7.6l4.6-1.5z"/></svg></button></div>
    <sc-for list="{{active}}" as="r" hint-placeholder-count="10">
      <sc-if value="{{r.isRepo}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; align-items: center; gap: 6px; padding: 8px 8px 3px; font-family: 'Geist Mono', monospace; font-size: 11px; color: #8B919B">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 4.5h4l1.5 1.5H14v6.5H2z"/></svg>{{r.label}}
        </div>
      </sc-if>
      <sc-if value="{{r.isSess}}" hint-placeholder-val="{{true}}">
        <button type="button" style="flex: none; {{r.style}}">
          <span style="flex: none; {{r.dot}}"></span>
          <span style="display: flex; flex-direction: column; min-width: 0; gap: 1px">
            <span style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 500">{{r.label}}</span>
            <span style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 11.5px; color: #8B919B">{{r.meta}}</span>
          </span>
          <span style="font-size: 11px; color: #8B919B; font-variant-numeric: tabular-nums">{{r.time}}</span>
        </button>
      </sc-if>
      <sc-if value="{{r.isAgents}}" hint-placeholder-val="{{false}}">
        <div style="margin: 2px 8px 2px 26px; padding: 6px 0 2px">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: #B4B9C1">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Subagents</span><span style="color: #8B919B">6 of 10 done</span>
          </div>
          <div style="display: flex; gap: 2px; margin: 6px 0 4px 20px">
            <span style="flex-grow: 6; height: 3px; border-radius: 2px; background: #7AA7F7"></span>
            <span style="flex-grow: 1; height: 3px; border-radius: 2px; background: #4CC38A"></span>
            <span style="flex-grow: 3; height: 3px; border-radius: 2px; background: #2E333A"></span>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{r.isSub}}" hint-placeholder-val="{{false}}">
        <button type="button" style="display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; padding: 4px 8px 4px 46px; border: 0; background: transparent; color: #B4B9C1; font: inherit; font-size: 12px; text-align: left; cursor: pointer">
          <span style="flex: none; {{r.dot}}"></span>
          <span style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{r.label}}</span>
          <span style="font-size: 11px; color: #8B919B">{{r.time}}</span>
        </button>
      </sc-if>
      <sc-if value="{{r.isMore}}" hint-placeholder-val="{{false}}">
        <button type="button" style="display: block; width: 100%; padding: 3px 8px 6px 68px; border: 0; background: transparent; color: #8B919B; font: inherit; font-size: 11.5px; text-align: left; cursor: pointer">{{r.label}}</button>
      </sc-if>
    </sc-for>

    <div style="display: flex; align-items: center; gap: 6px; padding: 14px 8px 4px; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #8B919B">Recent <span style="font-weight: 400">4</span><button type="button" aria-label="Ask about recent sessions" title="Ask about recent sessions" style="margin-left: auto; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 5px; border: 1px solid #3B3456; background: #1B1828; color: #C9B8F8; cursor: pointer"><svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1.5l1.5 4.6 4.6 1.5-4.6 1.5L8 13.7l-1.5-4.6L1.9 7.6l4.6-1.5z"/></svg></button></div>
    <sc-for list="{{recent}}" as="r" hint-placeholder-count="4">
      <button type="button" style="display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 6px 8px; border: 0; border-radius: 8px; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer">
        <span style="width: 8px; height: 8px; border-radius: 4px; border: 1.5px solid #5A606A; box-sizing: border-box"></span>
        <span style="display: flex; flex-direction: column; min-width: 0; gap: 1px">
          <span style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #B4B9C1">{{r.label}}</span>
          <span style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 11.5px; color: #8B919B">{{r.meta}}</span>
        </span>
        <span style="font-size: 11px; color: #8B919B">{{r.time}}</span>
      </button>
    </sc-for>

    <button type="button" style="display: flex; align-items: center; gap: 6px; width: 100%; padding: 14px 8px 4px; border: 0; background: transparent; font: inherit; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #8B919B; cursor: pointer">
      <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke-linecap="round" stroke-linejoin="round"/></svg>Closed <span style="font-weight: 400">124</span>
    </button>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid #23262C; font-size: 11.5px; color: #8B919B">
    <span>131 sessions · 3 live</span>
    <span style="flex-grow: 1"></span>
    <button type="button" aria-label="Keyboard shortcuts" style="width: 24px; height: 24px; border-radius: 6px; border: 1px solid #2E333A; background: transparent; color: #8B919B; font: inherit; font-family: 'Geist Mono', monospace; font-size: 11px; cursor: pointer">?</button>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["session","overview"],"default":"session"},"$preview":{"width":288,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? 'session';
    const sel = mode === 'session';
    const dot = (kind) => {
      const base = 'width: 8px; height: 8px; border-radius: 4px; box-sizing: border-box; justify-self: center;';
      if (kind === 'working') return base + ' background: #4CC38A; box-shadow: 0 0 0 3px rgba(76,195,138,0.18);';
      if (kind === 'turn') return base + ' background: #E8A63A;';
      if (kind === 'done') return base + ' background: #7AA7F7;';
      return base + ' border: 1.5px solid #5A606A;';
    };
    const rowStyle = (selected) => 'display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; padding: 6px 8px; border: 0; border-radius: 8px; color: inherit; font: inherit; text-align: left; cursor: pointer; background: ' + (selected ? '#22262C; box-shadow: inset 0 0 0 1px #3A4048;' : 'transparent;');
    const sess = (label, meta, time, kind, selected) => ({ isSess: true, label, meta, time, dot: dot(kind), style: rowStyle(selected) });
    const sub = (label, time, kind) => ({ isSub: true, label, time, dot: dot(kind) });
    const active = [
      { isRepo: true, label: '~/work/hive-mind' },
      sess('Issues documentation setup', 'main · PR #27 · 10 subagents', '6s', 'working', sel),
      { isAgents: true },
    ];
    if (sel) {
      active.push(
        sub('#6 sound pass', '1m', 'working'),
        sub('#5 juice pass', '2m', 'working'),
        sub('#11 ghost race', '3m', 'done'),
        sub("#10 Queen's Frame", '4m', 'done'),
        { isMore: true, label: '+ 6 more' }
      );
    }
    active.push(
      { isRepo: true, label: '~/work/agent-deck' },
      sess('Claude design improvements', 'main · desktop', '2s', 'working', false),
      sess('Phase 1 kickoff', 'main · your turn', '6m', 'turn', false)
    );
    return {
      active,
      recent: [
        { label: 'Hive-mind roadmap issues', meta: 'hive-mind · main', time: '52m' },
        { label: 'Agent status visibility options', meta: 'hive-mind · main', time: '52m' },
        { label: 'Session state migration to Mac Studio', meta: 'geebs · master', time: '30h' },
        { label: 'Minesweeper variant for fleet', meta: 'paulgibeault.github.io · PR #178', time: '30h' },
      ],
    };
  }
}
</script>
</body>
</html>
